# Access policy: which role may ask what, and how much privacy budget each requester gets.
# (The budget is per USER; the role only decides its initial size. See fedhealth/privacy/access_control/rbac.py)

k_threshold: 10          # answers whose NOISY count is below k are suppressed (see fedhealth/privacy/suppression.py)
default_delta: 1.0e-6    # delta used when a Gaussian query does not specify one
jwt_ttl_seconds: 1800

# DP noise is generated by the hospitals inside the MPC (fedhealth/privacy/dp/distributed.py).
# Every hospital reads this section too and REFUSES to add its share to a noise plan weaker than it.
distributed_noise:
  tolerance: 1                 # hospitals that may collude with the coordinator without seeing past the noise
  max_epsilon_per_query: 2.0   # the largest per-query budget any role may spend (hospital-side cap)
  max_delta_per_query: 1.0e-4
  max_noise_scale: 500000      # largest per-cell Laplace scale (Delta/epsilon) a hospital will draw: bounds the time
                               # the exact sampler takes (and so the deadline below). Larger: use the Gaussian mechanism

# Every hospital answers these coordinator calls no earlier than a public deadline (seconds), so the coordinator cannot
# time how many of its patients matched or how large its noise share came out (fedhealth/hospital/deadlines.py).
# Read by the HOSPITALS, never sent by the coordinator. Set for a 4-core machine; raise them on slower hardware.
response_deadlines:
  psi_init: 1.5                # load the patient list, pad, hash into the group
  psi_finalize: 0.25           # intersect the tags, map the true cohort (also: freeing it on delete)
  mpc_prepare: 0.25            # run the predicate, build indicator vectors over the padded index ...
  noise_per_cell: 0.005        # ... + this per output cell ...
  noise_per_scale: 1.0e-4      # ... + this per cell per unit of Laplace scale (Polya sampling time is ~linear in it)
  fl_train_per_epoch: 0.5      # local training, per epoch

# Budgets are (total_epsilon, total_delta). The ledger keeps a zCDP account (rho, converted at total_delta) next to
# basic composition and admits a query if either stays within budget - so total_delta > 0 is what unlocks zCDP.

roles:
  researcher:
    description: counts and histograms; modest budget
    aggs: [count, histogram]
    mechanisms: [laplace]
    max_epsilon_per_query: 1.0
    total_epsilon: 10.0
    total_delta: 1.0e-6
    audit: own               # may read only their own audit entries

  clinician:
    description: all aggregates incl. SUM/AVG; larger budget; Gaussian allowed
    aggs: [count, sum, avg, histogram]
    mechanisms: [laplace, gaussian]
    max_epsilon_per_query: 2.0
    total_epsilon: 20.0
    total_delta: 1.0e-4
    audit: own

  auditor:
    description: no data queries; reads the full audit log and verifies its integrity
    aggs: []
    mechanisms: []
    max_epsilon_per_query: 0.0
    total_epsilon: 0.0
    total_delta: 0.0
    audit: all
    verify_audit: true
